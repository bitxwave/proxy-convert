[package]
name = "subforge"
version = "2.0.0"
edition = "2021"
authors = ["Messica <Messica@example.com>"]
description = "A modern, extensible tool for forging unified proxy configurations from multiple subscription sources (Clash, Sing-box, V2Ray, etc.) with template-driven node selection."
license = "MIT"
repository = "https://github.com/bitxwave/subforge"
keywords = ["proxy", "clash", "sing-box", "v2ray", "subscription"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "subforge"
path = "src/lib.rs"

[dependencies]

clap = { version = "4.5", features = ["derive"] }

# default-features = false to avoid native-tls/openssl-sys on Linux (CI aarch64/musl have no OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1.48", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"

anyhow = "1.0"
thiserror = "2.0"
indexmap = { version = "2.12", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

config = "0.15"
dirs = "6.0"

url = "2.5"
serde_with = "3.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"

cached = { version = "0.56", features = ["async"] }
base64 = "0.22.1"
urlencoding = "2.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.23"
wiremock = "0.6"

[[bin]]
name = "subforge"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
